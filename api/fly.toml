# Backend de Sweet Cookies en Fly.io
app = "sweetcookies-api"
primary_region = "gru" # São Paulo, junto a Neon (aws-sa-east-1)

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Aplica migraciones pendientes en Neon (rama main) antes de publicar la nueva versión.
  release_command = "npx prisma migrate deploy"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  CLERK_TELEMETRY_DISABLED = "1"
  # ALLOWED_ORIGINS, DATABASE_URL, DATABASE_URL_UNPOOLED, CLERK_SECRET_KEY y
  # CLERK_PUBLISHABLE_KEY se cargan como secrets (fly secrets set), nunca acá.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
